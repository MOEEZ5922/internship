<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Research Framework</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #fcfcfc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Load Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        // Color Palette matching the user's image closely
        const rootColor = '#00102a'; 

        const colors = {
            c1: { main: '#e63946', light: '#ffebee', border: '#ffcdd2', text: '#b71c1c' }, // Context / State of Art (Red)
            c2: { main: '#f4a261', light: '#fff3e0', border: '#ffe0b2', text: '#e65100' }, // Objective / Methodology (Orange)
            c3: { main: '#e9c46a', light: '#fffde7', border: '#fff59d', text: '#f57f17' }, // Results / Implementation (Yellow)
            c4: { main: '#2a9d8f', light: '#e8f5e9', border: '#c8e6c9', text: '#1b5e20' }, // Research Problem (Green)
            c5: { main: '#1d3557', light: '#e3f2fd', border: '#bbdefb', text: '#0d47a1' }, // Research Question (Blue)
            c6: { main: '#7209b7', light: '#f3e5f5', border: '#e1bee7', text: '#4a148c' }, // Introduction (Purple)
        };

        // Helper to format heading nodes
        function heading(name, colorObj) {
            return {
                name: name,
                label: {
                    backgroundColor: colorObj.main,
                    color: '#ffffff',
                    padding: [8, 12],
                    borderRadius: 6,
                    fontWeight: 'bold',
                    fontSize: 13
                },
                lineStyle: { color: colorObj.main, width: 2 }
            };
        }

        // Helper to format text nodes
        function textNode(name, colorObj) {
            return {
                name: name,
                label: {
                    backgroundColor: colorObj.light,
                    color: colorObj.text,
                    borderColor: colorObj.border,
                    borderWidth: 1,
                    padding: [6, 10],
                    borderRadius: 4,
                    fontSize: 12
                },
                lineStyle: { color: colorObj.main, width: 1.5 }
            };
        }

        const data = {
            name: 'Evaluating Digital Biomarker Implementation\nin Personalized CPAP Therapy',
            label: {
                backgroundColor: rootColor,
                color: '#ffffff',
                padding: [12, 16],
                borderRadius: 8,
                fontSize: 15,
                fontWeight: 'bold',
                lineHeight: 20
            },
            children: [
                {
                    ...heading('Context', colors.c1),
                    children: [
                        textNode('Assess impact of digital biomarkers via a Role-Based Dashboard', colors.c1),
                        textNode('Validation: Real-time UI feedback loops', colors.c1),
                        textNode('Personalization: Backend AI-driven clustering', colors.c1)
                    ]
                },
                {
                    ...heading('Research Objective', colors.c2),
                    children: [
                        textNode('Obj1: Design a Full-Stack Role-Based UI Architecture', colors.c2),
                        textNode('Obj2: Establish Universal API Contracts for Biomarkers', colors.c2),
                        textNode('Obj3: Develop Backend AI-driven clustering models', colors.c2),
                        textNode('Obj4: Implement Frontend AI Triage Interfaces', colors.c2),
                        textNode('Obj5: Enhance patient engagement via mobile-first feedback', colors.c2)
                    ]
                },
                {
                    ...heading('Expected Results', colors.c3),
                    children: [
                        textNode('EX1: Scalable framework for medical dashboards', colors.c3),
                        textNode('EX2: Seamless clinical data synchronization', colors.c3),
                        textNode('EX3: Automated notifications via Exception Inbox', colors.c3),
                        textNode('EX4: User-friendly mobile adherence tracking', colors.c3)
                    ]
                },
                {
                    ...heading('Research Problem', colors.c4),
                    children: [
                        textNode('RP1: Lack of real-time validation due to disconnected backends', colors.c4),
                        textNode('RP2: Fragmented Multi-Vendor Hardware APIs', colors.c4),
                        textNode('RP3: Lack of AI-driven clustering data pipelines', colors.c4),
                        textNode('RP4: Information Asymmetry across clinical roles', colors.c4)
                    ]
                },
                {
                    ...heading('Research Question', colors.c5),
                    children: [
                        textNode('RQ1: How do API contracts ensure real-time clinical parity?', colors.c5),
                        textNode('RQ2: Which biomarkers are most predictive in the Physician UI?', colors.c5),
                        textNode('RQ3: How can backend clustering dynamically adjust therapy?', colors.c5),
                        textNode('RQ4: What event-driven UI mechanisms trigger early notifications?', colors.c5)
                    ]
                },
                {
                    ...heading('Introduction', colors.c6),
                    children: [
                        textNode('Background: Overcoming data silos in sleep medicine', colors.c6),
                        textNode('Contributions: Bridging Engineering and Medicine via Dashboards', colors.c6)
                    ]
                },
                {
                    ...heading('State of the Art', colors.c1),
                    children: [
                        textNode('Existing Models: Passive monitoring without UI feedback', colors.c1),
                        textNode('Gaps: No comprehensive dashboard linking biomarkers', colors.c1),
                        textNode('AI Personalization: Centralized event-based risk detection', colors.c1)
                    ]
                },
                {
                    ...heading('Methodology', colors.c2),
                    children: [
                        textNode('System Architecture: Frontend (React) & Backend (APIs)', colors.c2),
                        textNode('Data Ingestion: Wearables & CPAP Machine Data', colors.c2),
                        textNode('Validation: Human-in-the-loop Technician Triage', colors.c2)
                    ]
                },
                {
                    ...heading('Implementation', colors.c3),
                    children: [
                        textNode('Contract-First API Development', colors.c3),
                        textNode('Shared UI Component Library', colors.c3),
                        textNode('Real-Time State Management', colors.c3)
                    ]
                }
            ]
        };

        option = {
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove'
            },
            series: [
                {
                    type: 'tree',
                    data: [data],
                    top: '5%',
                    left: '12%',
                    bottom: '5%',
                    right: '30%',
                    symbolSize: 1, // Hide the dot symbol
                    initialTreeDepth: 3,
                    roam: true, // Allow zooming and panning
                    label: {
                        position: 'left',
                        verticalAlign: 'middle',
                        align: 'center'
                    },
                    leaves: {
                        label: {
                            position: 'right',
                            verticalAlign: 'middle',
                            align: 'left'
                        }
                    },
                    emphasis: {
                        focus: 'descendant'
                    },
                    expandAndCollapse: true,
                    animationDuration: 550,
                    animationDurationUpdate: 750
                }
            ]
        };

        option && myChart.setOption(option);
        
        // Handle window resize
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
